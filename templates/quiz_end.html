{% extends "base.html" %}

{% block title %}
    Quiz Results
{% endblock %}

{% block content %}
    <div class="container">
        <h1>Quiz Completed!</h1>
        
        <p>Congratulations on completing the quiz! Here are your results:</p>
        
        <div class="result">
            <h2>Your Score:</h2>
            <p>{{ score }}%</p>
        </div>
        
        <div class="actions">
            <a href="{{ url_for('home') }}" class="btn btn-primary">Return to Home</a>
            <a href="{{ url_for('show_categories') }}" class="btn btn-secondary">Browse More Quizzes</a>
        </div>
    </div>
{% endblock %}
