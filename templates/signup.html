{% extends "base.html" %} <!-- Extends the base template to inherit common layout and styles -->

{% block content %} <!-- Marks the beginning of the content block to be inserted into the base template -->
<div class="container"> <!-- Creates a container to hold the forms and other content -->

    <h1>Welcome to Health_Quest</h1> <!-- Page heading welcoming users to the Health_Quest app -->
    
    <p>Please log in or register to access our quizzes and resources.</p> <!-- Instruction text for the user -->

    <!-- Login Form -->
    <form id="loginForm" action="{{ url_for('login') }}" method="post">
        <!-- Grouping the username input field -->
        <div class="form-group">
            <input
                type="text" 
                name="username" 
                placeholder="Username" 
                class="input_field" 
                required 
            />
        </div>

        <!-- Grouping the password input field -->
        <div class="form-group">
            <input
                type="password" 
                name="password" 
                placeholder="Password" 
                class="input_field" 
                required 
            />
        </div>

        <!-- Login button -->
        <div class="form-group">
            <input
                type="submit" 
                value="Login" 
                class="btn btn-login" 
            />
        </div>
        <p>Don't have an account? <a href="#" onclick="showRegisterForm()">Register here</a></p>
    </form>

    <!-- Registration Form -->
    <form id="registerForm" action="{{ url_for('signup') }}" method="post" style="display: none;">
        <!-- Grouping the username input field -->
        <div class="form-group">
            <input
                type="text" 
                name="username" 
                placeholder="Username" 
                class="input_field" 
                required 
            />
        </div>

        <!-- Grouping the password input field -->
        <div class="form-group">
            <input
                type="password" 
                name="password" 
                placeholder="Password" 
                class="input_field" 
                required 
            />
        </div>
        
        <!-- Grouping the email input field -->
        <div class="form-group">
            <input
                type="email" 
                name="email" 
                placeholder="Email" 
                class="input_field" 
                required 
            />
        </div>

        <!-- Register button -->
        <div class="form-group">
            <input
                type="submit" 
                value="Register" 
                class="btn btn-register" 
            />
        </div>
        <p>Already have an account? <a href="#" onclick="showLoginForm()">Login here</a></p>
    </form>
</div>

<script>
    function showRegisterForm() {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("registerForm").style.display = "block";
    }

    function showLoginForm() {
        document.getElementById("loginForm").style.display = "block";
        document.getElementById("registerForm").style.display = "none";
    }
</script>
{% endblock %} <!-- Marks the end of the content block -->
